name: Sync Upstream

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Sync with upstream using official GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
        run: |
          gh repo sync ${{ github.repository }} --source MHSanaei/3x-ui --branch main
