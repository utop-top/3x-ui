name: Build and Push Custom Image

on:
  push:
    branches:
      - main  # 当 main 分支有了新的代码推入（包括同步成功的合并）时触发构建
  workflow_dispatch: # 允许手动触发构建

permissions:
  packages: write
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-xray-panel:
    runs-on: ubuntu-latest
    steps:
      # 1. 检出当前仓库的代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 启用 QEMU 模拟器以支持跨平台虚拟化编译
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 3. 配置 Docker Buildx 核心构建引擎
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. 登录到 GitHub Container Registry (GHCR)
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 5. 自动提取并生成 Docker 标签（包含 latest 和简短的 Git Commit SHA）
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      # 6. 执行多架构并行构建并发布镜像
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # 同时编译生成支持普通 PC/服务器和 ARM64 架构的通用双镜像包
          platforms: linux/amd64,linux/arm64
          tags: ${{ id.meta.outputs.tags }}
          labels: ${{ id.meta.outputs.labels }}
          # 托管于 GitHub Actions 内部的高效层级缓存，规避重复拉取依赖
          cache-from: type=gha
          cache-to: type=gha,mode=max
